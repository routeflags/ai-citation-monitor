# ai-citation-monitor configuration (example)
#
# Copy this file to aicm.toml and edit it. Credentials are NOT stored here: the
# file only names the environment variable that carries the key.

site_id = "example-shop"
site_name = "Example Shop"

# own_domain is a bare host name. A citation counts as "own" when the host is
# exactly this, or ends with ".<own_domain>" while subdomains = true.
own_domain = "example.shop"
subdomains = true

market = "ja-JP"
language = "ja"

# Paths are resolved from the current working directory; the tool assumes no
# repository layout.
db = "measurements/aicm.db"
report_dir = "reports"

# Brand terms are matched as substrings after NFKC, whitespace folding and
# lower-casing. A generic term can hit a sentence about someone else.
brand_terms = ["Example", "Example Shop"]

# Competitor domains you want to compare against. Ownership is not required:
# only public AI answers are observed. Applied at report time.
competitors = ["rival.example", "marketplace.example"]

[report]
# en (default) or ja. The CLI, --help and the errors stay English.
language = "en"

[providers.openai]
# A model name is never guessed: set it here or pass --model.
model = ""
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
timeout_seconds = 90

[providers.gemini]
model = ""
api_key_env = "GEMINI_API_KEY"
base_url = "https://generativelanguage.googleapis.com/v1beta"
timeout_seconds = 90

[budget]
# 0 means "no limit". The estimate is only computed when a price entry exists
# below; otherwise the run says "unknown" instead of pretending it is free.
max_usd = 0
currency = "USD"

[limits]
concurrency = 2
rpm = 20
# 3 by default. Set -1 to disable retries entirely.
max_retries = 3

# Token prices used ONLY for the cost estimate. Remove an entry and the estimate
# becomes "unknown" (never zero). input_tokens_per_call / output_tokens_per_call
# are needed to show an estimate before the first call.
[pricing."openai/<model>"]
input_usd_per_mtok = 0
output_usd_per_mtok = 0
input_tokens_per_call = 0
output_tokens_per_call = 0
