version: "2"

# Deliberately small. go vet is in the standard pipeline already; these are the
# linters that catch what a measurement tool cannot afford to get wrong: an
# ignored error, an ineffective assignment, dead code.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    # A function that no longer fits one review pass is where a rule gets lost.
    # The two gates measure different things: gocyclo counts branches, gocognit
    # weights them by nesting. Both are set where the tail has already been cut to
    # fit: 25 branches was the first baseline, and the ten functions above it were
    # split when the gate was introduced. gocyclo is now 20 because the three
    # functions that were still above it (two provider tests at 22 and 23, and
    # InsertRun at 21) were split in this change; 20 is one branch below the
    # smallest of those, so a checklist that grows back to that size fails next
    # time. Ordinary code is untouched either way: nothing left in the codebase
    # scores above 19 branches.
    #
    # gocognit is now 25 for the same reason: the nine functions that were still
    # above it (26-30 points: compare, the competitors/export/verify/report
    # commands, the CLI harness, the derived report sections, Execute and Migrate)
    # were split into helpers in this change, so 25 is one point below the smallest
    # of them. Nothing left scores above 24 points, and the gate still catches the
    # other shape, a deep nest with few branches: the two ceilings bound the same
    # functions from different directions (the tail now runs 15-19 branches and up
    # to 24 points).
    - gocyclo
    - gocognit
  settings:
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 25
    errcheck:
      # Closing and printing are not recoverable here: the operation is already
      # done, and failing a run because stderr was closed would hide the result.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*github.com/routeflags/ai-citation-monitor/internal/storage/sqlite.DB).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (net/http.ResponseWriter).Write

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
