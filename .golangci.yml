version: "2"

# Deliberately small. go vet is in the standard pipeline already; these are the
# linters that catch what a measurement tool cannot afford to get wrong: an
# ignored error, an ineffective assignment, dead code.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    # A function that no longer fits one review pass is where a rule gets lost.
    # The two gates measure different things: gocyclo counts branches, gocognit
    # weights them by nesting. Both thresholds sit at or above the 95th percentile
    # of the distribution this codebase had when they were introduced (19 branches,
    # 30 points), so ordinary code is untouched and the tail is forced to split:
    # the ten functions that exceeded them were split in the same change. gocyclo is
    # the tighter of the two because its scores are smaller: in this codebase
    # cognitive complexity runs about 1.5x the branch count, so 25 and 30 express
    # roughly the same ceiling.
    - gocyclo
    - gocognit
  settings:
    gocyclo:
      min-complexity: 25
    gocognit:
      min-complexity: 30
    errcheck:
      # Closing and printing are not recoverable here: the operation is already
      # done, and failing a run because stderr was closed would hide the result.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*github.com/routeflags/ai-citation-monitor/internal/storage/sqlite.DB).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (net/http.ResponseWriter).Write

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
